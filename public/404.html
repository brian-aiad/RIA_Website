<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B2146" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="description" content="The requested Rafla Insurance Agency page could not be found. Return home or contact the Mar Vista office." />
    <title>Page Not Found | Rafla Insurance Agency</title>
    <style>
      :root{color-scheme:light;--navy:#0B2146;--gold:#D5A11F;--paper:#F5F1E8;--white:#FFFEFB;--ink:#18263B;--muted:#566377;--rule:#D4CCBD}
      *{box-sizing:border-box}
      html{min-width:20rem;background:var(--navy)}
      body{display:grid;min-height:100svh;place-items:center;margin:0;border-block:6px solid var(--navy);color:var(--ink);background:var(--paper);font-family:"Segoe UI",Arial,sans-serif}
      main{display:grid;width:min(100% - 2rem,64rem);grid-template-columns:minmax(0,1fr) minmax(15rem,.6fr);border:1px solid var(--rule);border-top:6px solid var(--gold);background:var(--white);box-shadow:1rem 1rem 0 rgba(11,33,70,.08)}
      .copy{padding:clamp(2rem,7vw,5rem)}
      img{display:block;width:min(12rem,55vw);height:auto;margin-bottom:clamp(2.5rem,6vw,4.5rem)}
      .label{display:flex;align-items:center;gap:.65rem;margin:0;color:#7D5900;font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.label:before{content:"";width:2rem;height:3px;background:var(--gold)}
      h1{max-width:11ch;margin:.9rem 0 0;color:var(--navy);font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.7rem,6vw,5.2rem);font-weight:600;line-height:.96;letter-spacing:-.045em;text-wrap:balance}
      p{max-width:35rem;margin:1.2rem 0 0;color:var(--muted);font-size:1rem;line-height:1.65}
      nav{display:grid;align-content:center;padding:clamp(1.25rem,4vw,2.5rem);border-left:5px solid var(--gold);color:white;background:var(--navy)}
      nav>span{margin-bottom:.65rem;color:var(--gold);font-size:.62rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
      nav a{display:flex;min-height:3.5rem;align-items:center;justify-content:space-between;gap:1rem;border-bottom:1px solid rgba(255,255,255,.23);color:white;font-size:.82rem;font-weight:700;text-decoration:none}nav a:after{content:"→";color:var(--gold)}nav a:hover{color:var(--gold)}
      a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
      @media(max-width:700px){body{place-items:start center}main{grid-template-columns:1fr;margin:.75rem 0 1.25rem}.copy{padding:2rem 1rem}img{margin-bottom:2.5rem}nav{border-top:5px solid var(--gold);border-left:0;padding:1.1rem}}
    </style>
  </head>
  <body>
    <main>
      <section class="copy" aria-labelledby="not-found-title">
        <img src="/logo.svg" alt="Rafla Insurance Agency" width="208" height="52" />
        <p class="label">Error file / 404</p>
        <h1 id="not-found-title">We couldn’t find that page.</h1>
        <p>The address may have changed, or the link may be incomplete. Choose a useful way back—or call the office if you were looking for something specific.</p>
      </section>
      <nav aria-label="Page recovery options">
        <span>Continue with Rafla</span>
        <a href="/">Back home</a>
        <a href="/services">Insurance services</a>
        <a href="/locations">Service areas</a>
        <a href="tel:+13105727246">Call (310) 572-7246</a>
      </nav>
    </main>
  </body>
</html>
