<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page Not Found | Rafla Insurance Agency</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #102033;
        background: #f8fafc;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        width: min(92vw, 560px);
        padding: 40px 24px;
        text-align: center;
      }
      img {
        width: 160px;
        height: auto;
        margin-bottom: 28px;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.5rem);
        line-height: 1.05;
        letter-spacing: 0;
      }
      p {
        margin: 18px auto 0;
        max-width: 34rem;
        color: #475569;
        font-size: 1rem;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 28px;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 6px;
        background: #0f2f57;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #f6b44b;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="Rafla Insurance Agency" />
      <h1>Page not found</h1>
      <p>The page may have moved, or the address may be incorrect. Use the homepage to continue to Rafla Insurance Agency.</p>
      <a href="/">Go to homepage</a>
    </main>
  </body>
</html>
